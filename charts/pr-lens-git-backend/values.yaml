# Two by default: the server holds nothing that cannot be rebuilt, so a second
# replica costs a little memory and buys a rolling restart with no downtime.
replicaCount: 2

image:
  repository: ghcr.io/thejoeejoee/pr-lens-git-backend
  pullPolicy: IfNotPresent
  # Empty means the chart's appVersion, so a chart release pins its own image.
  tag: ""

imagePullSecrets: []
# The chart's own name is part of every resource name it renders, so a release
# installed when this chart was called pr-lens-gitlab-backend will see its
# Deployment and Service renamed on the first upgrade after the rename -- which
# Helm does as a replace, briefly. Set this to the old name to keep them:
#
#   nameOverride: pr-lens-gitlab-backend
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  # The only thing written to disk is the git mirror, in an emptyDir at /tmp.
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# The emptyDir mounted at /tmp, which is where the git mirror lives. Sized for
# the repository and the room a fetch needs to unpack into -- documents are
# small, but every revision of every canvas is still in there.
tmpSize: 1Gi

# The Secret holding GIT_TOKEN. Every key in it arrives as an environment
# variable, so anything else worth keeping out of a values file can go in it too
# -- though a name the settings below already set wins there, not here. This
# chart does not create it: a token belongs to whatever manages your secrets,
# not to a chart release.
#
#   kubectl create secret generic pr-lens-git \
#     --from-literal=GIT_TOKEN=glpat-xxxxxxxxxxxxxxxxxxxx
#
# Leave it empty for a remote that authenticates some other way -- an ssh key,
# or a host that needs no credential at all.
secretName: ""

service:
  type: ClusterIP
  port: 80
  annotations: {}

# Two ways in, both off. Pick whichever your cluster speaks.
ingress:
  enabled: false
  className: ""
  annotations: {}
  # The host answers become addresses under, and what config.publicUrl names.
  host: lens.example.com
  # More than one, for a release reachable under an internal name and a canonical
  # one at the same time. Set it and `host` above is ignored; every host gets the
  # same rule, since they are the same server.
  #
  #   hosts:
  #     - pr-lens.cdn.example.com
  #     - pr-lens.test.cdn.example.com
  #
  # Set config.publicUrl to the canonical one when you do: without it a canvas
  # pushed through either host comes back as a link to that host, so the same
  # canvas ends up with two addresses.
  hosts: []
  path: /
  pathType: Prefix
  # Written out as the Ingress takes it, so one certificate may cover several
  # hosts, or each host may have its own entry.
  tls: []
  #  - secretName: lens-tls
  #    hosts: [lens.example.com]

httpRoute:
  enabled: false
  annotations: {}
  hostnames:
    - lens.example.com
  parentRefs:
    - name: gateway
      # The Gateway's own namespace, when it is not this release's.
      # namespace: gateway-system
      # sectionName: https

# An optional Vinyl Cache sidecar -- the CDN half, without a CDN.
#
# Turn it on and the Service and the route point at the cache instead of the
# app, so there is one way in and nothing can bypass it. It needs no rules: the
# server already says what may be cached with Cache-Control, and Vinyl reads
# max-age and no-store itself, so the pictures are cached hard and the API and
# the canvas page never are.
cache:
  enabled: false

  image:
    # The rename from Varnish Cache has not reached Docker Hub, where the image
    # is still published as `varnish`. 9.x has no alpine variant yet.
    repository: varnish
    tag: "9.1.0.2"
    pullPolicy: IfNotPresent

  port: 8080

  # Cached objects live in the container's heap, so keep this well under the
  # memory limit below.
  size: 256m

  # The shared memory log. Vinyl defaults to 80m, which is more than a sidecar
  # nobody runs varnishlog against needs, and it has to fit in workdirSize.
  logSize: 8m

  # /var/lib/varnish, as a memory-backed emptyDir -- which means it counts
  # against the memory limit too. It must stay executable: varnishd compiles the
  # VCL to a shared object in here and dlopens it.
  workdirSize: 32Mi

  resources:
    requests:
      cpu: 25m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Your own VCL, replacing the chart's. Empty means the default, which is worth
  # reading before you override it: it is about twenty lines and most of them are
  # comments. Point `image` elsewhere and this becomes that program's config.
  vcl: ""

resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    # Drawing is synchronous CPU work, so a limit below a whole core turns a
    # burst of pushes into throttled requests.
    cpu: "1"
    memory: 768Mi

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# Extra environment for anything this chart does not name.
extraEnv: []

# For a self-managed GitLab behind a private CA: mount the bundle and point
# NODE_EXTRA_CA_CERTS at it through extraEnv.
extraVolumes: []
#  - name: gitlab-ca
#    configMap:
#      name: gitlab-ca
extraVolumeMounts: []
#  - name: gitlab-ca
#    mountPath: /etc/ssl/gitlab
#    readOnly: true

config:
  # The origin the answers' URLs are built from. Leave empty and each answer
  # names whichever host the request arrived on, which behind an ingress is
  # usually right but is worth stating.
  publicUrl: ""

  # git or memory. memory forgets every canvas when a pod restarts.
  store: git

  git:
    # Anything git can fetch from and push to. Required when store is git.
    #
    #   https://gitlab.example.com/my-group/canvases.git
    #   ssh://git@github.com/my-org/canvases.git
    #
    # An https remote takes GIT_TOKEN from the Secret below; an ssh one takes a
    # key, which means mounting it with extraVolumes and pointing
    # GIT_SSH_COMMAND at it through extraEnv.
    remote: ""
    branch: main
    prefix: canvases
    authorName: pr-lens-git-backend
    authorEmail: pr-lens-git-backend@example.com
    # Basic-auth user for an https remote; GIT_TOKEN is the password. Most hosts
    # ignore it; Bitbucket wants x-token-auth.
    username: oauth2
    # Where the mirror of the repository lives. Under /tmp because that is the
    # one writable path when the root filesystem is read-only, which also means
    # a pod that moves re-clones -- the mirror is a cache, not a copy of record.
    mirrorDir: /tmp/pr-lens-canvases.git
    # Zero asks the remote on every read that the read cache did not answer,
    # which is the freshness the docs promise. Raise it to trade freshness for
    # round trips.
    fetchTtlMs: 0
    # Ceiling on a single git invocation, fetches and pushes included.
    timeoutMs: 30000

  maxBodyBytes: 4000000
  readCacheTtlMs: 5000
  renderCacheBytes: 67108864
  # false turns this into a pure store: every answer carries tiles: [].
  draw: true

  # Zero on either turns that meter off. Both are per pod.
  mintsPerHourPerIp: 60
  pushesPerMinutePerCanvas: 30

  imageCacheControl: "public, max-age=31536000, immutable"
  embedCacheControl: "public, max-age=60, stale-while-revalidate=300"

  # True in a cluster, where the client address only ever arrives forwarded.
  trustProxy: true
  logRequests: true

  # The page at /. false answers NOT_FOUND there, for a deployment that would
  # rather not say what it is -- including when indexMarkdown holds one.
  indexPage: true

  # Your own page at /, in Markdown, instead of the one this server ships with.
  # It goes into a ConfigMap, is mounted at /etc/pr-lens/index.md, and is re-read
  # when it changes -- so `kubectl edit configmap` is the whole deployment, with
  # no rollout. Raw HTML is allowed for what Markdown cannot say; nothing that
  # executes is, so a <script> in here is dropped and could not run if it were
  # not.
  #
  # {{origin}}, {{store}}, {{canvases}}, {{version}} and {{diagrams}} are filled
  # in, since whoever writes this file cannot know them.
  #
  #   indexMarkdown: |
  #     # Platform canvases
  #
  #     Diagrams for the payments group. Ask in #platform-eng.
  #
  #     ```sh
  #     export PR_LENS_API_URL={{origin}}
  #     ```
  #
  # For a ConfigMap this chart does not own, leave this empty and mount it with
  # extraVolumes and extraVolumeMounts, then point INDEX_MARKDOWN_FILE at the
  # file through extraEnv.
  indexMarkdown: ""
